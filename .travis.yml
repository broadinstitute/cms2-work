sudo: required
dist: focal
os: linux
git:
  submodules: false
services:
- docker
env:
  global:
  - PYTHONIOENCODING=UTF8
  - LANGUAGE=wdl
  - secure: 
  - secure: 
  - secure: 
  - secure: 
  - secure: 
branches:
  except:
  - is-branch-info
stages:
- main
jobs:
  fast_finish: true
  include:
  - language: python
    stage: main
    python: '3.8'
    before_install:
    - openssl aes-256-cbc -K $encrypted_5C1BA6DF7B443119_key -iv $encrypted_5C1BA6DF7B443119_iv
      -in terra/gcloud-config.tar.gz.enc -out terra/gcloud-config.tar.gz -d
    - sudo apt-get update || true
    - sudo apt-get -y install openjdk-8-jre-headless
    install:
    - pip3 -q install firecloud PyYAML
    script:
    - set -e
    - "./travis/test-wdl.sh"
    - tar -xzf terra/gcloud-config.tar.gz -C $HOME
    - git submodule init docker/cms2-docker-component-stats
    - git submodule update --recursive docker/cms2-docker-component-stats
    - "./terra/terra_utils.py deploy_to_terra"
